<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f4f7;
        }

        .login-box {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        h2 {
            color: #b30000;
            margin-bottom: 5px;
        }

        .college-name {
            font-size: 14px;
            color: #555;
            margin-bottom: 25px;
        }

        .input-box {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        .input-box:focus {
            border-color: #b30000;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background: #b30000;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #8f0000;
        }

        .forgot {
            display: block;
            margin-top: 15px;
            color: #b30000;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <!-- College Logo -->
        <img src="college-logo.png" class="logo" alt="College Logo">

        <h2>Student Login</h2>

        <p class="college-name">
            Adhiparasakthi Engineering College
        </p>

        <form>
            <input 
                type="text" 
                class="input-box" 
                placeholder="Enter Username"
                required
            >

            <input 
                type="password" 
                class="input-box" 
                placeholder="Enter Password"
                required
            >

            <button type="submit" class="login-btn">
                Login
            </button>
        </form>

        <a href="#" class="forgot">Forgot Password?</a>

    </div>

</body>
</html>
