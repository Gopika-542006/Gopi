<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
        }

        .login-box {
            width: 350px;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        /* Logo */
        .logo {
            display: block;
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin: 0 auto 15px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-box {
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 15px;
            padding: 10px;
        }

        .input-box span {
            font-size: 20px;
            margin-right: 10px;
        }

        .input-box input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 15px;
        }

        .forgot {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot a {
            color: #0066cc;
            text-decoration: none;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #0066cc;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #004c99;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <!-- Logo -->
        <img src="https://dial4college.com/college/adhiparasakthi-engineering-college-kancheepuram" class="logo">

        <h2>Login</h2>

        <div class="input-box">
            <span>👤</span>
            <input type="text" placeholder="Username">
        </div>

        <div class="input-box">
            <span>🔒</span>
            <input type="password" placeholder="Password">
        </div>

        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>

        <button>Login</button>

    </div>

</body>
</html>
