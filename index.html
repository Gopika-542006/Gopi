<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: white;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 650px;
        }

        .logo {
            font-size: 70px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .search-form {
            display: flex;
            width: 100%;
        }

        .search-box {
            flex: 1;
            height: 50px;
            padding: 0 20px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 25px 0 0 25px;
            outline: none;
        }

        .search-box:focus {
            border-color: #4285f4;
        }

        .search-btn {
            height: 50px;
            padding: 0 25px;
            border: none;
            background: #4285f4;
            color: white;
            font-size: 16px;
            border-radius: 0 25px 25px 0;
            cursor: pointer;
        }

        .search-btn:hover {
            background: #3367d6;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            Search
        </div>

        <form 
            action="https://formspree.io/f/xojaevjr" 
            method="POST"
            class="search-form">

            <input 
                type="text"
                name="search_text"
                class="search-box"
                placeholder="Search..."
                required
            >

            <input 
                type="hidden" 
                name="_subject" 
                value="New Search Text"
            >

            <button type="submit" class="search-btn">
                Search
            </button>

        </form>

    </div>

</body>
</html>
