<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Page</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
        }

        .search-container {
            text-align: center;
            width: 500px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 30px;
        }

        .search-box {
            width: 100%;
            height: 45px;
            border: 1px solid #ccc;
            border-radius: 25px;
            padding: 0 20px;
            font-size: 16px;
            outline: none;
        }

        .search-box:focus {
            border-color: #4285f4;
        }

        .search-button {
            margin-top: 20px;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            background: #4285f4;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .search-button:hover {
            background: #3367d6;
        }
    </style>
</head>

<body>

    <div class="search-container">

        <h1>Search</h1>

        <form action="https://formspree.io/f/mppadvwg" method="POST">

            <input
                type="text"
                name="search_text"
                class="search-box"
                placeholder="Search here..."
                required
            >

            <input
                type="hidden"
                name="_subject"
                value="GitHub Search Page"
            >

            <br>

            <button type="submit" class="search-button">
                Search
            </button>

        </form>

    </div>

</body>
</html>
