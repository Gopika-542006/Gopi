<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 320px;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .forgot {
            text-align: right;
            margin: 5px 5px 20px;
        }

        .forgot a {
            color: #0066cc;
            text-decoration: none;
            font-size: 13px;
        }

        button {
            width: 98%;
            padding: 12px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #004c99;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <img class="logo"
             src="https://dial4college.blr1.cdn.digitaloceanspaces.com/pro/3569/logo/1738317241.jpg"
             alt="College Logo">

        <h2>Login</h2>

        <input type="text" placeholder="👤 Username">

        <input type="password" placeholder="🔒 Password">

        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>

        <button>Login</button>

    </div>

</body>
</html>
