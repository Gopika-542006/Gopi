<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dial4College - Login</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        /* College Logo */
        .logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
            display: block;
            margin: 0 auto 10px;
        }

        .college-name {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #222;
            margin-bottom: 5px;
        }

        .login-title {
            text-align: center;
            color: #666;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .input-box > i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
        }

        .input-box input {
            width: 100%;
            height: 48px;
            padding: 0 45px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .input-box input:focus {
            border-color: #e31b23;
        }

        .eye {
            position: absolute;
            right: 15px;
            left: auto !important;
            cursor: pointer;
        }

        .forgot {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 22px;
        }

        .forgot a {
            color: #e31b23;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 8px;
            background: #e31b23;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #b9151b;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- College Logo -->
        <!-- Save the uploaded logo as "college-logo.png" -->
        <img src="college-logo.png"
             alt="Adhiparasakthi Engineering College Logo"
             class="logo">

        <div class="college-name">Dial4College</div>
        <div class="login-title">Login</div>

        <!-- Username -->
        <div class="input-box">
            <i class="fa-solid fa-user"></i>
            <input type="text" placeholder="Username">
        </div>

        <!-- Password -->
        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password"
                   id="password"
                   placeholder="Password">

            <i class="fa-solid fa-eye eye"
               id="eyeIcon"
               onclick="showPassword()"></i>
        </div>

        <!-- Forgot Password -->
        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>

        <!-- Login -->
        <button class="login-btn" onclick="login()">
            Login
        </button>

    </div>

    <script>
        function showPassword() {
            const password = document.getElementById("password");
            const eye = document.getElementById("eyeIcon");

            if (password.type === "password") {
                password.type = "text";
                eye.classList.remove("fa-eye");
                eye.classList.add("fa-eye-slash");
            } else {
                password.type = "password";
                eye.classList.remove("fa-eye-slash");
                eye.classList.add("fa-eye");
            }
        }

        function login() {
            const username = document.querySelector(
                'input[placeholder="Username"]'
            ).value;

            const password = document.getElementById("password").value;

            if (username === "" || password === "") {
                alert("Please enter Username and Password");
            } else {
                alert("Login Successful!");
            }
        }
    </script>

</body>
</html>
